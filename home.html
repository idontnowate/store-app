<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <script>
    (function () {
        try {
            var p = JSON.parse(localStorage.getItem('storePrefs') || '{}');
            var dark = p.theme === 'dark' || (!p.theme && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.style.background = dark ? '#0b0c0e' : '#f6f6f7';
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
    })();
</script>
<style>
    @view-transition { navigation: auto; }
</style>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الصفحة الرئيسية</title>
    <script src="storage.js?v=202610222"></script>
    <script src="products.js?v=202610222"></script>
    <script src="log.js?v=202610222"></script>
    <script src="i18n-en.js?v=202610222"></script>
    <script src="theme.js?v=202610222"></script>
    <script src="auth.js?v=202610222"></script>
    <script src="layout.js?v=202610222"></script>
    <style>
        :root {
            --page: #efede5;
            --olive: #40570d;
            --olive-dark: #344807;
            --panel: #d1cec5;
            --ink: #10110d;
            --muted: #5a5a52;
            --line: #bdb9ae;
            --green: #91d94c;
            --red: #c74845;
            --font: Tahoma, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: var(--font);
        }

        /* ===== الشريط العلوي ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 22% 10px 4%;
        }

        .topbar h1 {
            margin: 0;
            font-size: clamp(28px, 3vw, 44px);
        }

        .brand {
            text-align: center;
            color: var(--green);
            font-size: 26px;
            font-weight: 700;
            line-height: 1.5;
        }

        .brand span {
            display: block;
            color: var(--olive-dark);
            font-size: 20px;
        }

        /* ===== القائمة الجانبية ===== */
        .sidebar {
            position: fixed;
            top: 4px;
            right: 1.4%;
            bottom: 1%;
            width: 17.8%;
            min-width: 230px;
            border-radius: 48px;
            background: var(--panel);
            padding: 22px 16px 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 10px 14px #0002;
            overflow-y: auto;
        }

        .sidebar nav {
            display: grid;
            gap: 2px;
        }

        .sidebar nav.bottom {
            margin-top: auto;
        }

        .sidebar a {
            display: block;
            padding: 8px 13px;
            color: var(--ink);
            text-decoration: none;
            font-size: clamp(18px, 1.7vw, 28px);
            font-weight: 700;
            border-radius: 28px;
            line-height: 1.2;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #8d956e;
        }

        /* ===== المحتوى ===== */
        .dash {
            margin: 10px 21.7% 30px 3%;
            display: grid;
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 1px 3px #0001;
            min-width: 0;
        }

        .card h2 {
            margin: 0;
            font-size: 22px;
            color: var(--olive-dark);
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .card-head a {
            color: var(--olive);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .card-head a:hover {
            text-decoration: underline;
        }

        /* بطاقات الملخص */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
        }

        .stat {
            background: var(--panel);
            border-radius: 26px;
            padding: 16px 18px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 1px 3px #0001;
            color: var(--olive-dark);
        }

        .stat.hero {
            background: var(--olive);
            color: var(--page);
        }

        .stat .label {
            font-size: 15px;
            font-weight: 700;
            opacity: .9;
        }

        .stat .value {
            font-size: clamp(20px, 2vw, 26px);
            font-weight: 700;
            margin-top: 6px;
            word-break: break-word;
        }

        .stat .note {
            font-size: 13px;
            font-weight: 700;
            opacity: .85;
        }

        /* عمودان: المبيعات والتنبيهات */
        .cols {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 16px;
            align-items: start;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            font-size: 14px;
            padding: 10px 4px;
            color: var(--muted);
            border-bottom: 2px solid var(--line);
            white-space: nowrap;
        }

        td {
            font-size: 15px;
            font-weight: 700;
            padding: 12px 4px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        td.empty {
            color: var(--muted);
            padding: 24px 4px;
        }

        .pay {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--page);
            font-size: 13px;
        }

        .pay.debt {
            background: #f0d9d6;
            color: var(--red);
        }

        .alert-list {
            display: grid;
            gap: 10px;
        }

        .alert {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--page);
            color: var(--olive-dark);
            border-radius: 18px;
            padding: 12px 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }

        .alert:hover {
            outline: 2px solid var(--olive);
        }

        .alert .count {
            min-width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--olive);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 15px;
        }

        .alert.ok {
            color: var(--muted);
            justify-content: center;
        }

        /* ===== الشاشات المتوسطة ===== */
        @media (max-width: 1050px) {
            .sidebar {
                width: 200px;
                min-width: 0;
                padding: 16px 10px;
            }

            .sidebar a {
                font-size: 19px;
            }

            .topbar {
                padding-right: 230px;
            }

            .dash {
                margin: 10px 230px 20px 20px;
            }

            .cols {
                grid-template-columns: 1fr;
            }
        }

        /* ===== الهاتف ===== */
        @media (max-width: 650px) {
            .topbar {
                flex-direction: column;
                gap: 8px;
                padding: 64px 5% 10px;
            }

            .topbar h1 {
                font-size: 28px;
            }

            .brand {
                font-size: 20px;
            }

            .brand span {
                font-size: 16px;
            }

            .sidebar {
                position: static;
                width: auto;
                min-width: 0;
                margin: 0 4%;
                padding: 12px;
                border-radius: 20px;
                box-shadow: none;
            }

            .sidebar nav {
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar nav.bottom {
                margin-top: 8px;
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar a {
                font-size: 17px;
                padding: 8px;
            }

            .dash {
                margin: 16px 4% 20px;
                gap: 14px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat {
                min-height: 120px;
                padding: 12px;
                border-radius: 22px;
            }

            .stat .value {
                font-size: 18px;
            }

            .card {
                border-radius: 22px;
                padding: 14px;
            }
        }
    </style>

</head>

<body>
    <header class="topbar">
        <h1>الصفحة الرئيسية</h1>
        <div class="brand" id="storeBrand">مرحبا بك<span>“اسم المتجر”</span></div>
    </header>

    <aside class="sidebar" aria-label="القائمة الرئيسية">
        <nav>
            <a class="active" href="home.html" aria-current="page">الصفحة الرئيسية</a>
            <a href="cashier.html">الكاشير</a>
            <a href="sales-new_1.html">المبيعات</a>
            <a href="inventory.html">المخزن</a>
            <a href="purchases.html">المشتريات</a>
            <a href="debts.html">الديون</a>
            <a href="cashbox.html">الصندوق</a>
            <a href="reports.html">التقارير</a>
        </nav>
        <nav class="bottom">
            <a href="settings.html">الإعدادات</a>
            <a href="exchange-rate.html">سعر الصرف</a>
        </nav>
    </aside>

    <main class="dash">
        <section class="stats" id="stats" aria-label="ملخص المتجر"></section>

        <div class="cols">
            <section class="card" aria-label="آخر المبيعات">
                <div class="card-head">
                    <h2>آخر المبيعات</h2>
                    <a href="sales-new_1.html">عرض الكل</a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>الفاتورة</th>
                                <th>الزبون</th>
                                <th>المبلغ</th>
                                <th>الدفع</th>
                            </tr>
                        </thead>
                        <tbody id="salesRows"></tbody>
                    </table>
                </div>
            </section>

            <section class="card" aria-label="التنبيهات">
                <div class="card-head">
                    <h2>تنبيهات تحتاج إجراء</h2>
                </div>
                <div class="alert-list" id="alerts"></div>
            </section>
        </div>
    </main>

    <script>
        const INVOICES_KEY = 'storeInvoices';
        const PAYMENTS_KEY = 'storeDebtPayments';
        const PRODUCTS_KEY = 'storeProducts';
        const ADJUSTMENTS_KEY = 'storeStockAdjustments';
        const PURCHASES_KEY = 'storePurchases';
        const CASH_OPENING_KEY = 'storeCashOpening';
        const CASH_MANUAL_KEY = 'storeCashManual';

        function safeParse(text) {
            try {
                const value = JSON.parse(text || '[]');
                return Array.isArray(value) ? value : [];
            } catch {
                return [];
            }
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function money(n) {
            return Number(n || 0).toLocaleString('en-US') + ' د.ع';
        }

        function num(n) {
            return Number(n || 0).toLocaleString('en-US');
        }

        function todayLocal() {
            const d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().slice(0, 10);
        }

        function invoiceTotal(inv) {
            if (Array.isArray(inv.items)) {
                const subtotal = inv.items.reduce((s, it) => s + Number(it.total || 0), 0);
                return Math.max(0, subtotal - Number(inv.discount || 0));
            }
            return Number(inv.amount || 0);
        }

        function purchaseTotal(p) {
            const subtotal = (p.items || []).reduce((s, it) => s + Number(it.total || 0), 0);
            return Math.max(0, subtotal - Number(p.discount || 0));
        }

        function computeData() {
            const invoices = safeParse(localStorage.getItem(INVOICES_KEY));
            const payments = safeParse(localStorage.getItem(PAYMENTS_KEY));
            const products = safeParse(localStorage.getItem(PRODUCTS_KEY));
            const adjustments = safeParse(localStorage.getItem(ADJUSTMENTS_KEY));
            const purchases = safeParse(localStorage.getItem(PURCHASES_KEY));
            const manual = safeParse(localStorage.getItem(CASH_MANUAL_KEY));
            const opening = Number(localStorage.getItem(CASH_OPENING_KEY) || 0);
            const today = todayLocal();

            const paidFor = number => payments
                .filter(p => p.invoiceNumber === number)
                .reduce((s, p) => s + Number(p.amount || 0), 0);

            const rows = invoices.map((inv, index) => {
                const amount = invoiceTotal(inv);
                const paid = paidFor(inv.number);
                return { inv, index, amount, paid, remaining: Math.max(0, amount - paid) };
            });

            // المبيعات اليومية
            const todaySales = rows.filter(r => r.inv.date === today);
            const todayTotal = todaySales.reduce((s, r) => s + r.amount, 0);

            // رصيد الصندوق
            let cashIn = opening;
            let cashOut = 0;
            rows.forEach(r => {
                if (r.inv.payment === 'نقدي' || r.inv.payment === 'بطاقة') cashIn += r.amount;
            });
            payments.forEach(p => { cashIn += Number(p.amount || 0); });
            purchases.forEach(p => {
                if (p.payment === 'نقدي' || p.payment === 'بطاقة' || (p.payment === 'دين' && p.settled)) {
                    cashOut += purchaseTotal(p);
                }
            });
            manual.forEach(m => {
                if (m.kind === 'in') cashIn += Number(m.amount || 0);
                else cashOut += Number(m.amount || 0);
            });
            const cashBalance = cashIn - cashOut;

            // ديون الزبائن
            const openDebts = rows.filter(r => r.inv.payment === 'دين' && r.remaining > 0);
            const debtTotal = openDebts.reduce((s, r) => s + r.remaining, 0);
            const debtCustomers = new Set(openDebts.map(r => (r.inv.customer || '').trim())).size;

            // المخزون بسعر التكلفة
            const stockRows = products.map(p => {
                const adjusted = adjustments
                    .filter(a => a.productId === p.id)
                    .reduce((s, a) => s + Number(a.change || 0), 0);
                const sold = StoreProducts.soldQty(p, rows.map(r => r.inv));
                const qty = Number(p.openingQty || 0) + adjusted - sold;
                return { p, qty, value: Math.max(0, qty) * Number(p.cost || 0) };
            });
            const stockValue = stockRows.reduce((s, r) => s + r.value, 0);
            const productCount = products.length;

            // الربح التقديري
            let cogs = 0;
            rows.forEach(r => {
                if (!Array.isArray(r.inv.items)) return;
                r.inv.items.forEach(it => {
                    const prod = StoreProducts.productOf(it, products);
                    cogs += Number(it.qty || 0) * Number(prod?.cost || 0);
                });
            });
            const rawSales = rows.reduce((s, r) => s + r.amount, 0);
            const profit = rawSales - cogs;

            // المشتريات غير المسددة
            const unpaidPurchases = purchases.filter(p => p.payment === 'دين' && !p.settled);
            const unpaidPurchasesTotal = unpaidPurchases.reduce((s, p) => s + purchaseTotal(p), 0);

            // آخر المبيعات
            const latest = [...rows]
                .sort((a, b) => (b.inv.date || '').localeCompare(a.inv.date || '') || b.index - a.index)
                .slice(0, 6);

            // التنبيهات
            const lowStock = stockRows.filter(r => r.qty <= Number(r.p.minQty || 0));
            const alerts = [];
            if (lowStock.length) {
                alerts.push({ count: lowStock.length, text: 'منتجات وصلت للحد الأدنى للمخزون', href: 'inventory.html' });
            }
            if (openDebts.length) {
                alerts.push({ count: openDebts.length, text: `فواتير دين غير مسددة - ${money(debtTotal)}`, href: 'debts.html' });
            }
            if (unpaidPurchases.length) {
                alerts.push({ count: unpaidPurchases.length, text: `فواتير مورد غير مسددة - ${money(unpaidPurchasesTotal)}`, href: 'purchases.html' });
            }

            return {
                stats: [
                    { title: 'صافي الربح التقديري', value: money(profit), note: 'الإيراد − تكلفة المباع', hero: true },
                    { title: 'مبيعات اليوم', value: money(todayTotal), note: `${num(todaySales.length)} فاتورة` },
                    { title: 'رصيد الصندوق', value: money(cashBalance), note: 'النقد الحالي' },
                    { title: 'المخزون (بالتكلفة)', value: money(stockValue), note: `${num(productCount)} منتج` },
                    { title: 'ديون الزبائن', value: money(debtTotal), note: `${num(debtCustomers)} زبون` }
                ],
                latest,
                alerts
            };
        }

        function render() {
            const data = computeData();

            const info = window.getStoreInfo ? window.getStoreInfo() : { name: 'اسم المتجر' };
            document.getElementById('storeBrand').innerHTML = `مرحبا بك<span>“${esc(info.name)}”</span>`;

            document.getElementById('stats').innerHTML = data.stats.map(item => `
                <article class="stat ${item.hero ? 'hero' : ''}">
                    <div>
                        <div class="label">${esc(item.title)}</div>
                        <div class="value">${item.value}</div>
                    </div>
                    <div class="note">${esc(item.note)}</div>
                </article>`).join('');

            document.getElementById('salesRows').innerHTML = data.latest.length
                ? data.latest.map(r => `
                    <tr>
                        <td>#${esc(r.inv.number)}</td>
                        <td>${esc(r.inv.customer)}</td>
                        <td>${money(r.amount)}</td>
                        <td><span class="pay ${r.inv.payment === 'دين' ? 'debt' : ''}">${esc(r.inv.payment)}</span></td>
                    </tr>`).join('')
                : `<tr><td class="empty" colspan="4">لا توجد مبيعات بعد</td></tr>`;

            document.getElementById('alerts').innerHTML = data.alerts.length
                ? data.alerts.map(item => `
                    <a class="alert" href="${item.href}">
                        <span class="count">${num(item.count)}</span>
                        <span>${esc(item.text)}</span>
                    </a>`).join('')
                : `<div class="alert ok">لا توجد تنبيهات حالياً</div>`;
        }

        window.addEventListener('storage', render);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

        try {
            render();
        } catch (err) {
            console.error('فشل تحميل الصفحة الرئيسية:', err);
        }
    </script>
</body>

</html>
