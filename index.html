<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الدخول</title>
    <script src="log.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <style>
        :root {
            --page: #efede5;
            --olive: #40570d;
            --olive-dark: #344807;
            --panel: #d1cec5;
            --ink: #10110d;
            --muted: #5a5a52;
            --line: #bdb9ae;
            --red: #c74845;
            --green: #91d94c;
            --font: Tahoma, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 22px;
            background: var(--page);
            color: var(--ink);
            font-family: var(--font);
            padding: 16px;
        }

        .brand {
            text-align: center;
            color: var(--green);
            font-size: 26px;
            font-weight: 700;
            line-height: 1.5;
        }

        .brand span {
            display: block;
            color: var(--olive-dark);
            font-size: 20px;
        }

        .card {
            width: min(420px, 100%);
            background: var(--panel);
            border-radius: 36px;
            padding: 32px 28px;
            box-shadow: 8px 10px 12px #0003;
        }

        h1 {
            margin: 0 0 22px;
            text-align: center;
            color: var(--olive-dark);
            font-size: 30px;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 6px;
            font-weight: 700;
            font-size: 16px;
            color: var(--olive-dark);
        }

        input {
            height: 50px;
            border: 3px solid #777;
            border-radius: 12px;
            padding: 0 12px;
            font: 17px var(--font);
            color: var(--ink);
            background: #fff;
            min-width: 0;
        }

        input:focus {
            outline: 3px solid var(--olive);
            outline-offset: 1px;
        }

        button {
            height: 52px;
            border: 0;
            border-radius: 16px;
            background: var(--olive);
            color: var(--page);
            font: 700 19px var(--font);
            cursor: pointer;
            box-shadow: 4px 6px 10px #0002;
        }

        button:hover {
            background: var(--olive-dark);
        }

        button:disabled {
            opacity: .6;
            cursor: default;
        }

        .error {
            min-height: 20px;
            color: var(--red);
            font-weight: 700;
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header class="brand">مرحبا بك<span>تسجيل الدخول إلى حسابك</span></header>

    <main class="card">
        <h1>تسجيل الدخول</h1>
        <form id="loginForm" novalidate>
            <label>اسم المستخدم
                <input name="username" autocomplete="username" required>
            </label>
            <label>كلمة المرور
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <div class="error" id="error" role="alert"></div>
            <button type="submit" id="submitBtn">دخول</button>
        </form>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async event => {
            event.preventDefault();
            errorEl.textContent = '';

            if (!form.reportValidity()) return;

            submitBtn.disabled = true;
            try {
                await StoreAuth.ready;
                await StoreAuth.login(form.elements.username.value, form.elements.password.value);
                location.replace('home.html');
            } catch (err) {
                errorEl.textContent = err.message || 'تعذر تسجيل الدخول';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
