<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <script>
    (function () {
        try {
            var p = JSON.parse(localStorage.getItem('storePrefs') || '{}');
            var dark = p.theme === 'dark' || (!p.theme && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.style.background = dark ? '#0b0c0e' : '#f6f6f7';
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
    })();
</script>
<style>
    @view-transition { navigation: auto; }
</style>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>المستخدمين</title>
    <script src="log.js?v=20261022"></script>
    <script src="theme.js?v=20261022"></script>
    <script src="auth.js?v=20261022"></script>
    <script src="layout.js?v=20261022"></script>
    <style>
        :root {
            --page: #efede5;
            --olive: #40570d;
            --olive-dark: #344807;
            --panel: #d1cec5;
            --ink: #10110d;
            --muted: #5a5a52;
            --line: #bdb9ae;
            --red: #c74845;
            --green: #91d94c;
            --font: Tahoma, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: var(--font);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 22% 10px 4%;
        }

        .topbar h1 {
            margin: 0;
            font-size: clamp(28px, 3vw, 44px);
        }

        .brand {
            text-align: center;
            color: var(--green);
            font-size: 26px;
            font-weight: 700;
            line-height: 1.5;
        }

        .brand span {
            display: block;
            color: var(--olive-dark);
            font-size: 20px;
        }

        .sidebar {
            position: fixed;
            top: 4px;
            right: 1.4%;
            bottom: 1%;
            width: 17.8%;
            min-width: 230px;
            border-radius: 48px;
            background: var(--panel);
            padding: 22px 16px 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 10px 14px #0002;
            overflow-y: auto;
        }

        .sidebar nav {
            display: grid;
            gap: 2px;
        }

        .sidebar nav.bottom {
            margin-top: auto;
        }

        .sidebar a {
            display: block;
            padding: 8px 13px;
            color: var(--ink);
            text-decoration: none;
            font-size: clamp(18px, 1.7vw, 28px);
            font-weight: 700;
            border-radius: 28px;
            line-height: 1.2;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #8d956e;
        }

        main {
            margin: 10px 21.7% 30px 3%;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 18px;
            align-items: start;
        }

        .card {
            background: var(--panel);
            border-radius: 36px;
            padding: 20px 22px;
            box-shadow: 8px 10px 12px #0003;
        }

        .card h2 {
            margin: 0 0 14px;
            color: var(--olive-dark);
            font-size: 26px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            display: grid;
            gap: 5px;
            font-weight: 700;
            font-size: 15px;
        }

        input,
        select {
            height: 46px;
            border: 3px solid #777;
            border-radius: 12px;
            padding: 0 12px;
            font: 16px var(--font);
            background: #fff;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }

        .btn {
            height: 50px;
            border: 0;
            border-radius: 14px;
            background: var(--red);
            color: #fff;
            font: 700 18px var(--font);
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .6;
            cursor: default;
        }

        .msg {
            min-height: 20px;
            font-weight: 700;
            font-size: 15px;
        }

        .msg.ok {
            color: var(--olive);
        }

        .msg.err {
            color: var(--red);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--page);
            border-radius: 18px;
            overflow: hidden;
            text-align: center;
            font-size: 15px;
        }

        th {
            background: var(--olive);
            color: var(--page);
            padding: 10px 6px;
        }

        td {
            padding: 10px 6px;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
        }

        .role {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            background: #d8ecc0;
            color: var(--olive-dark);
            font-size: 13px;
        }

        .role.admin {
            background: #cfdcef;
            color: #23405f;
        }

        @media (max-width: 1050px) {
            .sidebar {
                width: 200px;
                min-width: 0;
                padding: 16px 10px;
            }

            .sidebar a {
                font-size: 19px;
            }

            .topbar {
                padding-right: 230px;
            }

            main {
                margin: 10px 230px 30px 20px;
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                position: static;
                width: auto;
                min-width: 0;
                margin: 0 4% 16px;
                padding: 10px;
                border-radius: 20px;
                box-shadow: none;
            }

            .sidebar nav {
                grid-template-columns: repeat(2, 1fr);
            }

            .topbar {
                padding: 16px 5%;
                flex-direction: column;
                gap: 8px;
            }

            main {
                margin: 0 4% 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>
    <header class="topbar">
        <h1>المستخدمين</h1>
        <div class="brand">مرحبا بك<span>“اسم المتجر”</span></div>
    </header>

    <aside class="sidebar" aria-label="القائمة الرئيسية">
        <nav>
            <a href="home.html">الصفحة الرئيسية</a>
            <a href="cashier.html">الكاشير</a>
            <a href="sales-new_1.html">المبيعات</a>
            <a href="inventory.html">المخزن</a>
            <a href="purchases.html">المشتريات</a>
            <a href="debts.html">الديون</a>
            <a href="cashbox.html">الصندوق</a>
            <a href="reports.html">التقارير</a>
        </nav>
        <nav class="bottom">
            <a href="settings.html">الإعدادات</a>
            <a href="exchange-rate.html">سعر الصرف</a>
        </nav>
    </aside>

    <main>
        <section class="grid">
            <article class="card">
                <h2>إضافة مستخدم</h2>
                <form id="addForm" novalidate>
                    <label>اسم المستخدم (إنجليزي)
                        <input name="username" required autocomplete="off" placeholder="ahmed">
                    </label>
                    <label>الاسم الظاهر
                        <input name="name" required autocomplete="off" placeholder="أحمد">
                    </label>
                    <label>كلمة المرور
                        <input name="password" type="password" required minlength="8" autocomplete="new-password">
                    </label>
                    <label>الدور
                        <select name="role">
                            <option value="employee">موظف مبيعات</option>
                            <option value="admin">مدير</option>
                        </select>
                    </label>
                    <p class="hint">أحرف إنجليزية وأرقام و . _ - فقط، وكلمة المرور 8 أحرف على الأقل.</p>
                    <button class="btn" type="submit">إضافة</button>
                    <div class="msg" id="msg" role="status" aria-live="polite"></div>
                </form>
            </article>

            <article class="card">
                <h2>المستخدمون في المتجر</h2>
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>اسم الدخول</th>
                            <th>الدور</th>
                            <th>تاريخ الإضافة</th>
                        </tr>
                    </thead>
                    <tbody id="memberRows"></tbody>
                </table>
            </article>
        </section>
    </main>

    <script>
        const memberRows = document.getElementById('memberRows');
        const addForm = document.getElementById('addForm');
        const msg = document.getElementById('msg');

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        async function loadMembers() {
            const client = await StoreAuth.getClient();
            const { data, error } = await client
                .from('store_members')
                .select('username, display_name, role, created_at')
                .order('created_at', { ascending: true });

            if (error) {
                memberRows.innerHTML = `<tr><td colspan="4">${esc(error.message)}</td></tr>`;
                return;
            }

            memberRows.innerHTML = data.map(m => `
                <tr>
                    <td>${esc(m.display_name)}</td>
                    <td>${esc(m.username)}</td>
                    <td><span class="role ${m.role === 'admin' ? 'admin' : ''}">${StoreAuth.roleLabel(m.role)}</span></td>
                    <td>${new Date(m.created_at).toLocaleDateString('ar')}</td>
                </tr>`).join('');
        }

        addForm.addEventListener('submit', async event => {
            event.preventDefault();
            msg.textContent = '';
            msg.className = 'msg';

            if (!addForm.reportValidity()) return;

            const me = StoreAuth.currentUser();
            const session = await StoreAuth.getSession();
            if (!me || !session) {
                location.replace('index.html');
                return;
            }

            const f = addForm.elements;
            const submitBtn = addForm.querySelector('button[type=submit]');
            submitBtn.disabled = true;

            try {
                const res = await fetch(StoreAuth.config.functionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${session.access_token}`,
                        apikey: StoreAuth.config.key
                    },
                    body: JSON.stringify({
                        storeId: me.store_id,
                        username: f.username.value,
                        name: f.name.value,
                        password: f.password.value,
                        role: f.role.value
                    })
                });

                const out = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(out.error || 'تعذر إنشاء المستخدم');

                msg.textContent = `تمت إضافة المستخدم ${out.username}`;
                msg.className = 'msg ok';
                addForm.reset();
                await loadMembers();
            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'msg err';
            } finally {
                submitBtn.disabled = false;
            }
        });

        StoreAuth.ready.then(() => {
            const me = StoreAuth.currentUser();
            if (me && me.role === 'admin') loadMembers();
        });
    </script>
</body>

</html>
