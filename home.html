<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لوحة المتجر</title>
    <script src="storage.js"></script>
    <script src="auth.js"></script>
    <style>
        :root {
            --page: #efede5;
            --olive: #40570d;
            --olive-dark: #344807;
            --muted-card: #d1cec5;
            --ink: #15170d;
            --line: rgba(239, 237, 229, .22);
            --radius: 40px;
            --font: Tahoma, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: var(--font);
        }

        .topbar {
            min-height: 118px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: start;
            padding: 0 22% 0 5.2%;
            position: relative;
        }

        .brand {
            grid-column: 3;
            justify-self: end;
            text-align: center;
            padding-top: 2px;
            color: #91d94c;
            font-size: 27px;
            font-weight: 700;
            line-height: 1.6;
        }

        .brand span {
            display: block;
            color: var(--olive-dark);
            font-size: 24px;
        }

        h1 {
            grid-column: 2;
            justify-self: center;
            margin: 18px 0 0;
            font-size: clamp(29px, 3vw, 42px);
            white-space: nowrap;
        }

        .menu-button {
            display: none;
        }

        .sidebar {
            position: fixed;
            z-index: 4;
            top: 4px;
            right: 1.4%;
            bottom: 1%;
            width: 17.8%;
            min-width: 230px;
            border-radius: 48px;
            background: var(--muted-card);
            padding: 72px 16px 28px;
            display: flex;
            flex-direction: column;
        }

        .sidebar nav {
            display: grid;
            gap: 2px;
        }

        .sidebar a {
            display: block;
            padding: 8px 13px;
            color: var(--ink);
            text-decoration: none;
            font-size: clamp(20px, 1.8vw, 30px);
            font-weight: 700;
            border-radius: 28px;
            line-height: 1.2;
        }

        .sidebar a.active,
        .sidebar a:hover {
            background: #8d956e;
        }

        .sidebar .bottom-links {
            margin-top: auto;
        }

        .menu-panel {
            display: none;
            position: absolute;
            z-index: 5;
            top: 62px;
            left: 5.5%;
            min-width: 190px;
            padding: 10px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px #0002;
        }

        .menu-panel.open {
            display: grid;
        }

        .menu-panel a {
            padding: 12px;
            color: var(--olive-dark);
            text-decoration: none;
            border-radius: 10px;
        }

        .menu-panel a:hover {
            background: var(--page);
        }

        .dashboard {
            width: min(1428px, 88%);
            margin: 0 20% 60px 5%;
            display: grid;
            grid-template-columns: minmax(360px, 1.45fr) minmax(300px, .95fr) minmax(310px, 1fr);
            grid-template-rows: auto auto;
            gap: 44px 5.3%;
            align-items: start;
        }

        .stats {
            grid-column: 1 / 3;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 7%;
        }

        .stat-card {
            min-height: 192px;
            border-radius: var(--radius);
            background: var(--muted-card);
            padding: 12px 18px;
            color: var(--olive-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat-title {
            font-size: 27px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 8px;
        }

        .stat-note {
            text-align: left;
            font-size: 19px;
        }

        .sales {
            grid-column: 3;
            grid-row: 1 / 3;
            background: var(--olive);
            color: var(--page);
            border-radius: var(--radius);
            padding: 10px 18px 22px;
            min-height: 714px;
            overflow: hidden;
        }

        .sales-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
        }

        .sales-heading a {
            color: var(--page);
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 23px;
            text-align: center;
        }

        th {
            font-size: 20px;
            padding: 13px 4px;
            color: #e8e5db;
        }

        td {
            font-size: 15px;
            font-weight: 700;
            padding: 12px 2px;
            border-top: 3px solid var(--line);
            white-space: nowrap;
        }

        .empty-lines {
            margin-top: 13px;
        }

        .empty-lines div {
            height: 45px;
            border-bottom: 3px solid var(--line);
        }

        .alerts {
            grid-column: 1 / 3;
            background: var(--olive);
            color: var(--page);
            border-radius: var(--radius);
            padding: 13px 22px 25px;
        }

        .alerts h2 {
            font-size: 27px;
            margin: 0 8px 8px;
        }

        .alert-list {
            display: grid;
            gap: 11px;
        }

        .alert {
            background: var(--page);
            color: var(--olive-dark);
            border-radius: 30px;
            padding: 13px 18px;
            text-align: center;
            font-size: 18px;
        }

        .alert strong {
            margin-inline-start: 13px;
        }

        @media (max-width: 1050px) {
            .sidebar {
                width: 200px;
                min-width: 0;
                padding: 60px 12px 20px;
            }

            .dashboard {
                width: calc(100% - 250px);
                margin: 0 230px 50px 20px;
                grid-template-columns: minmax(250px, 1.2fr) minmax(280px, 1fr);
                gap: 24px;
            }

            .stats {
                grid-column: 1 / 3;
            }

            .sales {
                grid-column: 2;
                grid-row: 2 / 4;
                min-height: 600px;
            }

            .alerts {
                grid-column: 1;
                grid-row: 2;
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                position: static;
                width: auto;
                min-width: 0;
                margin: 0 4%;
                padding: 12px;
                border-radius: 20px;
            }

            .sidebar nav {
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar .bottom-links {
                margin-top: 8px;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar a {
                font-size: 17px;
                padding: 8px;
            }

            .dashboard {
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            .stats {
                grid-column: 1 / 3;
                gap: 12px;
            }

            .sales {
                grid-column: 1;
                grid-row: 2 / 4;
                min-height: 630px;
            }

            .alerts {
                grid-column: 2;
                grid-row: 2;
            }

            .stat-card {
                min-height: 160px;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                min-height: 90px;
                padding: 0 5%;
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }

            .brand {
                grid-column: 1;
                font-size: 18px;
            }

            .brand span {
                font-size: 16px;
            }

            h1 {
                grid-column: 2;
                font-size: 25px;
                margin-top: 18px;
            }

            .dashboard {
                width: 92%;
                margin: 0 auto 40px;
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .stats,
            .sales,
            .alerts {
                grid-column: 1;
                grid-row: auto;
            }

            .stats {
                gap: 10px;
            }

            .stat-card {
                min-height: 145px;
                padding: 12px;
                border-radius: 28px;
            }

            .stat-title {
                font-size: 19px;
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-note {
                font-size: 14px;
            }

            .sales {
                min-height: auto;
            }

            .alerts h2 {
                font-size: 22px;
            }

            .alert {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="brand" id="storeBrand">مرحبا بك<span>"اسم المتجر"</span></div>
        <h1 id="pageTitle" style="height: 200px;">الصفحة الرئيسية</h1>
    </header>

    <aside class="sidebar" aria-label="القائمة الرئيسية">
        <nav id="mainNavigation"></nav>
        <nav class="bottom-links" id="settingsNavigation"></nav>
    </aside>

    <main class="dashboard">
        <section class="stats" id="stats" aria-label="ملخص المتجر"></section>
        <section class="sales">
            <div class="sales-heading"><span>آخر المبيعات</span><a id="allSalesLink" href="#">عرض الكل</a></div>
            <table>
                <thead>
                    <tr>
                        <th>الفاتورة</th>
                        <th>الزبون</th>
                        <th>المبلغ</th>
                        <th>الدفع</th>
                    </tr>
                </thead>
                <tbody id="salesRows"></tbody>
            </table>
            <div class="empty-lines" aria-hidden="true">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </section>
        <section class="alerts">
            <h2>تنبيهات تحتاج إجراء</h2>
            <div class="alert-list" id="alerts"></div>
        </section>
    </main>

   <script>
   
    // ===== إعدادات عامة =====
            const INVOICES_KEY = 'storeInvoices';
            const PAYMENTS_KEY = 'storeDebtPayments';
            const STORE_NAME = 'اسم المتجر';

            const navigation = [
            {label: 'الصفحة الرئيسية', href: 'home.html', active: true },
            {label: 'المبيعات', href: 'sales-new_1.html' },
            {label: 'المخزن', href: 'inventory.html' },
            {label: 'المشتريات', href: 'purchases.html' },
            {label: 'الديون', href: 'debts.html' },
            {label: 'الصندوق', href: 'cashbox.html' },
            {label: 'التقارير', href: 'reports.html' }
            ];

            const settingsNavigation = [
            {label: 'الإعدادات', href: 'settings.html' },
            {label: 'سعر الصرف', href: 'exchange-rate.html' }
            ];

            // ===== أدوات مساعدة =====
            function safeParse(text) {
        try {
            const value = JSON.parse(text || '[]');
            return Array.isArray(value) ? value : [];
        } catch {
            return [];
        }
    }

            function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

                function money(n) {
        return Number(n || 0).toLocaleString('en-US') + ' د.ع';
    }

                function todayLocal() {
        const d = new Date();
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 10);
    }

                function paidFor(payments, number) {
        return payments
            .filter(p => p.invoiceNumber === number)
            .reduce((sum, p) => sum + Number(p.amount || 0), 0);
    }

                // ===== حساب البيانات من التخزين =====
                function computeData() {
        const invoices = safeParse(localStorage.getItem(INVOICES_KEY));
                const payments = safeParse(localStorage.getItem(PAYMENTS_KEY));
                const today = todayLocal();

        const rows = invoices.map((inv, index) => {
            const amount = Number(inv.amount || 0);
                const paid = paidFor(payments, inv.number);
                const remaining = Math.max(0, amount - paid);
                return {inv, index, amount, paid, remaining};
        });

        // مبيعات اليوم
        const todaySales = rows.filter(r => r.inv.date === today);
        const todayTotal = todaySales.reduce((s, r) => s + r.amount, 0);

        // المحصّل: فواتير نقدي/بطاقة كاملة + ما سُدّد من فواتير الدين المفتوحة
        const collected = rows.reduce((sum, r) => {
            if (r.inv.payment === 'دين') return sum + r.paid;
                return sum + r.amount;
        }, 0);

        // الديون المفتوحة
        const openDebts = rows.filter(r => r.inv.payment === 'دين' && r.remaining > 0);
        const debtTotal = openDebts.reduce((s, r) => s + r.remaining, 0);
        const debtCustomers = new Set(openDebts.map(r => (r.inv.customer || '').trim())).size;

                // آخر المبيعات
                const latest = [...rows]
            .sort((a, b) => (b.inv.date || '').localeCompare(a.inv.date || '') || b.index - a.index)
                .slice(0, 6);

                return {
                    stats: [
                {title: 'المحصّل', value: money(collected), note: 'نقدي وبطاقة وتسديدات الديون' },
                {title: 'مبيعات اليوم', value: money(todayTotal), note: `${todaySales.length.toLocaleString('en-US')} فاتورة` },
                {title: 'المخزون', value: money(0), note: 'لم يُربط المخزن بعد' },
                {title: 'ديون الزبائن الكلية', value: money(debtTotal), note: `${debtCustomers.toLocaleString('en-US')} زبون` }
                ],
                latest,
                alerts: [
                openDebts.length
                ? {count: String(openDebts.length), text: `فواتير دين غير مسددة - ${money(debtTotal)}`, href: 'debts.html' }
                : null,
                debtCustomers
                ? {count: String(debtCustomers), text: 'زبائن عليهم ديون مستحقة', href: 'debts.html' }
                : null
                ].filter(Boolean)
        };
    }

                // ===== عرض البيانات =====
                function render() {
        const data = computeData();

                document.getElementById('storeBrand').innerHTML = `مرحبا بك<span>"${escapeHtml(STORE_NAME)}"</span>`;
                document.getElementById('pageTitle').textContent = 'الصفحة الرئيسية';
                document.getElementById('allSalesLink').href = 'sales-new_1.html';

        const makeNavLink = item => `<a href="${item.href}" ${item.active ? ' class="active" aria-current="page"' : ''}>${item.label}</a>`;
                document.getElementById('mainNavigation').innerHTML = navigation.map(makeNavLink).join('');
                document.getElementById('settingsNavigation').innerHTML = settingsNavigation.map(makeNavLink).join('');

        document.getElementById('stats').innerHTML = data.stats.map(item => `
                <article class="stat-card"><div><div class="stat-title">${escapeHtml(item.title)}</div><div class="stat-value">${item.value}</div></div><div class="stat-note">${escapeHtml(item.note)}</div></article>`).join('');

                document.getElementById('salesRows').innerHTML = data.latest.length
            ? data.latest.map(r => `
                <tr><td>#${escapeHtml(r.inv.number)}</td><td>${escapeHtml(r.inv.customer)}</td><td>${money(r.amount)}</td><td>${escapeHtml(r.inv.payment)}</td></tr>`).join('')
                : `<tr><td colspan="4">لا توجد مبيعات بعد</td></tr>`;

                document.getElementById('alerts').innerHTML = data.alerts.length
            ? data.alerts.map(item => `
                <a class="alert" href="${item.href}"><strong>${escapeHtml(item.count)}</strong>${escapeHtml(item.text)}</a>`).join('')
                : `<div class="alert">لا توجد تنبيهات حالياً</div>`;
    }

    // تحديث الصفحة عند تغيير البيانات من صفحة أخرى أو تبويب آخر
    window.addEventListener('storage', event => {
        if (event.key === INVOICES_KEY || event.key === PAYMENTS_KEY) render();
    });

    // تحديث عند العودة إلى الصفحة من تبويب آخر
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) render();
    });

    render();
    </script>

</body>

</html>
