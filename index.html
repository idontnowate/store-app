    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            background:
                radial-gradient(1200px 600px at 50% -10%, var(--surface-3), transparent 60%),
                var(--bg) !important;
        }

        .sheet {
            width: min(420px, 100%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px 28px;
            box-shadow: var(--shadow-lg);
        }

        .brand {
            margin-bottom: 28px;
        }

        .mark {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: var(--primary);
            color: var(--primary-text);
            margin-bottom: 22px;
        }

        .mark svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -.01em;
            color: var(--text);
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 14.5px;
        }

        form {
            display: grid;
            gap: 16px;
        }

        .field {
            display: grid;
            gap: 7px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-2);
        }

        .field input {
            width: 100%;
            height: 46px;
        }

        .remember {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            column-gap: 10px;
            row-gap: 2px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            user-select: none;
        }

        .remember input {
            width: 20px;
            height: 20px;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .remember small {
            grid-column: 2;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
        }

        .error {
            min-height: 20px;
            margin: -4px 0 -6px;
            color: var(--danger-text);
            font-size: 13.5px;
            font-weight: 500;
        }

        .error:empty {
            display: none;
        }

        .submit {
            height: 46px;
            margin-top: 4px;
            border: 0;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: var(--primary-text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, transform .1s;
        }

        .submit:hover {
            background: var(--primary-hover);
        }

        .submit:active {
            transform: translateY(1px);
        }

        .submit:disabled {
            opacity: .55;
            cursor: default;
            transform: none;
        }

        .terms {
            margin: 22px 0 0;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .terms a {
            color: var(--text-2);
            font-weight: 500;
            text-decoration: none;
        }

        .terms a:hover {
            color: var(--text);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .sheet {
                padding: 28px 22px 22px;
                border-radius: 18px;
            }
        }

        .demo-entry {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            margin-top: 18px;
            color: var(--muted);
            font-size: 14px;
        }

        .demo-btn {
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--text);
            border-radius: 999px;
            padding: 8px 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .demo-btn:hover {
            background: var(--surface-2);
        }

<body class="standalone">
    <main class="sheet">
        <header class="brand">
            <div class="mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M3.5 9.5 5 4.5h14l1.5 5"/><path d="M3.5 9.5a2.8 2.8 0 0 0 5.67 0 2.8 2.8 0 0 0 5.66 0 2.8 2.8 0 0 0 5.67 0"/><path d="M5 12.5v7h14v-7"/><path d="M10 19.5v-4h4v4"/></svg>
            </div>
            <h1>تسجيل الدخول</h1>
            <p>أهلاً بعودتك، أدخل بياناتك للمتابعة</p>
        </header>

        <form id="loginForm" novalidate>
            <label class="field">
                <span>اسم المستخدم</span>
                <input name="username" autocomplete="username" required>
            </label>
            <label class="field">
                <span>كلمة المرور</span>
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <label class="remember">
                <input type="checkbox" name="remember" checked>
                <span>تذكرني</span>
                <small>يبقى الدخول بعد إغلاق البرنامج، ويُحفظ اسم المستخدم</small>
            </label>

            <div class="error" id="error" role="alert"></div>

            <button type="submit" class="submit" id="submitBtn">دخول</button>
        </form>

        <div class="demo-entry">
            <span>ليس لديك حساب؟</span>
            <button type="button" class="demo-btn" id="demoBtn">جرّب البرنامج بدون حساب</button>
        </div>

        <p class="terms">باستخدامك البرنامج فأنت توافق على <a href="terms.html">شروط الاستخدام</a></p>
    </main>

    <script>
        // المتجر التجريبي: من الزر، أو من رابط index.html?demo=1 (للإعلانات)
        function startDemo() {
            try {
                StoreDemo.start();
            } catch (err) {
                document.getElementById('error').textContent = err.message;
            }
        }
        document.getElementById('demoBtn').addEventListener('click', startDemo);
        if (new URLSearchParams(location.search).get('demo') === '1') startDemo();

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        // خرج من البرنامج لأن المدير أوقف الجهاز، أو لأن المتجر وصل لحد الأجهزة
        const forcedOut = window.StoreAuth && StoreAuth.takeForcedOutMessage ? StoreAuth.takeForcedOutMessage() : '';
        if (forcedOut) errorEl.textContent = forcedOut;

        // «تذكرني»: الاختيار واسم المستخدم يُحفظان لهذا الجهاز
        const REMEMBER_KEY = 'appRemember';
        const REMEMBER_USER_KEY = 'appRememberUser';
        try {
            const remember = localStorage.getItem(REMEMBER_KEY) !== '0';
            form.elements.remember.checked = remember;
            const saved = remember ? localStorage.getItem(REMEMBER_USER_KEY) : '';
            if (saved) {
                form.elements.username.value = saved;
                form.elements.password.focus();
            }
        } catch (e) { }

        function rememberChoice(username) {
            try {
                if (form.elements.remember.checked) {
                    localStorage.setItem(REMEMBER_KEY, '1');
                    localStorage.setItem(REMEMBER_USER_KEY, username.trim());
                    localStorage.removeItem('appSessionTemp');
                } else {
                    // ينتهي الدخول عند إغلاق البرنامج أو المتصفح (storage.js و auth.js)
                    localStorage.setItem(REMEMBER_KEY, '0');
                    localStorage.removeItem(REMEMBER_USER_KEY);
                    localStorage.setItem('appSessionTemp', '1');
                    sessionStorage.setItem('appSessionAlive', '1');
                }
            } catch (e) { }
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            errorEl.textContent = '';

            if (!form.reportValidity()) return;

            submitBtn.disabled = true;
            try {
                await StoreAuth.ready;
                await StoreAuth.login(form.elements.username.value, form.elements.password.value);
                rememberChoice(form.elements.username.value);
                location.replace('home.html');
            } catch (err) {
                errorEl.textContent = err.message || 'تعذر تسجيل الدخول';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
