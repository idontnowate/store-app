<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إدارة المتجر</title>
<style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #111113; color: #f2f2f7; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    .box { max-width: 460px; padding: 32px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #a1a1aa; line-height: 1.8; margin: 0 0 22px; }
    button { height: 46px; padding: 0 28px; border: 0; border-radius: 12px; background: #0a84ff; color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
    small { display: block; margin-top: 16px; color: #71717a; }
</style>
</head>
<body>
<div class="box">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>أول تشغيل للبرنامج على هذا الكمبيوتر يحتاج إنترنت لتحميل البرنامج وتسجيل الدخول. بعدها يعمل البرنامج بدون إنترنت.</p>
    <button type="button" id="retry">إعادة المحاولة</button>
    <small id="auto"></small>
</div>
<script>
    const target = new URLSearchParams(location.search).get('url');
    const go = () => { if (target) location.href = target; };
    document.getElementById('retry').addEventListener('click', go);
    let n = 15;
    setInterval(() => {
        n--;
        document.getElementById('auto').textContent = `محاولة تلقائية بعد ${n} ثانية`;
        if (n <= 0) { n = 15; if (navigator.onLine) go(); }
    }, 1000);
</script>
</body>
</html>
