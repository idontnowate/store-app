<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <script>
    (function () {
        try {
            var p = JSON.parse(localStorage.getItem('storePrefs') || '{}');
            var dark = p.theme === 'dark' || (!p.theme && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.style.background = dark ? '#0b0c0e' : '#f6f6f7';
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
    })();
</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الاشتراك متوقف</title>
    <script src="log.js?v=202610231"></script>
    <script src="i18n-en.js?v=202610231"></script>
    <script src="theme.js?v=202610231"></script>
    <script src="auth.js?v=202610231"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 16px;
        }

        .sheet {
            width: min(460px, 100%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 34px 30px 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .mark {
            width: 52px;
            height: 52px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--warn-soft);
            color: var(--warn-text);
        }

        .mark svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        p {
            margin: 0 0 10px;
            color: var(--text-2);
            font-size: 14.5px;
            line-height: 1.9;
        }

        .store {
            color: var(--muted);
            font-size: 13.5px;
        }

        .contact {
            margin: 16px 0 4px;
            padding: 12px;
            border-radius: 12px;
            background: var(--surface-2);
            font-weight: 600;
            color: var(--text);
        }

        .buttons {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .buttons .btn {
            width: 100%;
        }

        .note {
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="design.css?v=202610231">
</head>

<body class="standalone">
    <main class="sheet">
        <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </div>
        <h1 id="title">انتهى اشتراك المتجر</h1>
        <p class="store" id="storeName"></p>
        <p>بياناتك محفوظة ولن تُحذف. تواصل مع مزود الخدمة لتجديد الاشتراك، وسيعود البرنامج للعمل فور التجديد.</p>
        <div class="contact" id="contact" hidden></div>
        <div class="buttons">
            <button class="btn" type="button" id="recheckBtn">تحقق مرة أخرى</button>
            <button class="btn secondary" type="button" id="signOutBtn">تسجيل الخروج</button>
        </div>
        <div class="note" id="note" role="status"></div>
    </main>

    <script>
        const A = window.StoreAuth;

        function show(st) {
            if (st && st.status === 'suspended') $title('المتجر موقوف مؤقتًا');
        }

        function $title(text) {
            document.getElementById('title').textContent = text;
        }

        if (A.supportContact) {
            const c = document.getElementById('contact');
            c.textContent = 'للتجديد: ' + A.supportContact;
            c.hidden = false;
        }

        A.ready.then(() => {
            const info = A.getStoreInfo();
            if (info && info.name) document.getElementById('storeName').textContent = info.name;
            show(A.subscriptionStatus());
        });

        document.getElementById('recheckBtn').addEventListener('click', async e => {
            const btn = e.currentTarget;
            const note = document.getElementById('note');
            btn.disabled = true;
            note.textContent = 'جارِ التحقق…';
            // إذا جُدّد الاشتراك ينقل checkSubscription إلى الصفحة الرئيسية
            const st = await A.checkSubscription();
            btn.disabled = false;
            if (!st) note.textContent = 'تعذر الاتصال. تحقق من الإنترنت ثم حاول مجددًا.';
            else if (st.status === 'expired' || st.status === 'suspended') {
                show(st);
                note.textContent = 'الاشتراك ما زال متوقفًا.';
            }
        });

        document.getElementById('signOutBtn').addEventListener('click', () => A.logout());
    </script>
</body>

</html>
