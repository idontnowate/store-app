    <style>
        :root {
            --page: #efede5;
            --olive: #40570d;
            --olive-dark: #344807;
            --panel: #d1cec5;
            --ink: #10110d;
            --muted: #5a5a52;
            --line: #bdb9ae;
            --green: #91d94c;
            --red: #c74845;
            --font: Tahoma, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: var(--font);
        }

        /* ===== الشريط العلوي ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 22% 10px 4%;
        }

        .topbar h1 {
            margin: 0;
            font-size: clamp(28px, 3vw, 44px);
        }

        .brand {
            text-align: center;
            color: var(--green);
            font-size: 26px;
            font-weight: 700;
            line-height: 1.5;
        }

        .brand span {
            display: block;
            color: var(--olive-dark);
            font-size: 20px;
        }

        /* ===== القائمة الجانبية ===== */
        .sidebar {
            position: fixed;
            top: 4px;
            right: 1.4%;
            bottom: 1%;
            width: 17.8%;
            min-width: 230px;
            border-radius: 48px;
            background: var(--panel);
            padding: 22px 16px 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 10px 14px #0002;
            overflow-y: auto;
        }

        .sidebar nav {
            display: grid;
            gap: 2px;
        }

        .sidebar nav.bottom {
            margin-top: auto;
        }

        .sidebar a {
            display: block;
            padding: 8px 13px;
            color: var(--ink);
            text-decoration: none;
            font-size: clamp(18px, 1.7vw, 28px);
            font-weight: 700;
            border-radius: 28px;
            line-height: 1.2;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #8d956e;
        }

        /* ===== المحتوى ===== */
        .dash {
            margin: 10px 21.7% 30px 3%;
            display: grid;
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 1px 3px #0001;
            min-width: 0;
        }

        .card h2 {
            margin: 0;
            font-size: 22px;
            color: var(--olive-dark);
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .card-head a {
            color: var(--olive);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .card-head a:hover {
            text-decoration: underline;
        }

        /* خطوات البدء لمتجر جديد */
        .setup {
            margin-bottom: 16px;
        }

        .setup-head p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }

        .setup-hide {
            border: 0;
            background: none;
            color: var(--muted);
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px;
        }

        .setup-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 10px;
        }

        .setup-step {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 16px;
            color: inherit;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }

        .setup-step:hover {
            border-color: var(--olive);
        }

        .setup-step .tick {
            flex: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--line);
            display: grid;
            place-items: center;
        }

        .setup-step.done {
            color: var(--muted);
        }

        .setup-step.done .tick {
            background: var(--olive);
            border-color: var(--olive);
        }

        .setup-step.done .tick::after {
            content: "";
            width: 10px;
            height: 5px;
            border: solid var(--card, #fff);
            border-width: 0 0 2px 2px;
            transform: translateY(-1px) rotate(-45deg);
        }

        .setup-step.done span:last-child {
            text-decoration: line-through;
        }

        /* بطاقات الملخص */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
        }

        .stat {
            background: var(--panel);
            border-radius: 26px;
            padding: 16px 18px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 1px 3px #0001;
            color: var(--olive-dark);
        }

        .stat.hero {
            background: var(--olive);
            color: var(--page);
        }

        .stat .label {
            font-size: 15px;
            font-weight: 700;
            opacity: .9;
        }

        .stat .value {
            font-size: clamp(20px, 2vw, 26px);
            font-weight: 700;
            margin-top: 6px;
            word-break: break-word;
        }

        .stat .note {
            font-size: 13px;
            font-weight: 700;
            opacity: .85;
        }

        /* عمودان: المبيعات والتنبيهات */
        .cols {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 16px;
            align-items: start;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            font-size: 14px;
            padding: 10px 4px;
            color: var(--muted);
            border-bottom: 2px solid var(--line);
            white-space: nowrap;
        }

        td {
            font-size: 15px;
            font-weight: 700;
            padding: 12px 4px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        td.empty {
            color: var(--muted);
            padding: 24px 4px;
        }

        .pay {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--page);
            font-size: 13px;
        }

        .pay.debt {
            background: #f0d9d6;
            color: var(--red);
        }

        .alert-list {
            display: grid;
            gap: 10px;
        }

        .alert {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--page);
            color: var(--olive-dark);
            border-radius: 18px;
            padding: 12px 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }

        .alert:hover {
            outline: 2px solid var(--olive);
        }

        .alert .count {
            min-width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--olive);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 15px;
        }

        .alert .txt {
            display: grid;
            gap: 2px;
            min-width: 0;
        }

        .alert .txt small {
            font-weight: 500;
            font-size: 13px;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .alert.ok {
            color: var(--muted);
            justify-content: center;
        }

        /* ===== الشاشات المتوسطة ===== */
        @media (max-width: 1050px) {
            .sidebar {
                width: 200px;
                min-width: 0;
                padding: 16px 10px;
            }

            .sidebar a {
                font-size: 19px;
            }

            .topbar {
                padding-right: 230px;
            }

            .dash {
                margin: 10px 230px 20px 20px;
            }

            .cols {
                grid-template-columns: 1fr;
            }
        }

        /* ===== الهاتف ===== */
        @media (max-width: 650px) {
            .topbar {
                flex-direction: column;
                gap: 8px;
                padding: 64px 5% 10px;
            }

            .topbar h1 {
                font-size: 28px;
            }

            .brand {
                font-size: 20px;
            }

            .brand span {
                font-size: 16px;
            }

            .sidebar {
                position: static;
                width: auto;
                min-width: 0;
                margin: 0 4%;
                padding: 12px;
                border-radius: 20px;
                box-shadow: none;
            }

            .sidebar nav {
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar nav.bottom {
                margin-top: 8px;
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar a {
                font-size: 17px;
                padding: 8px;
            }

            .dash {
                margin: 16px 4% 20px;
                gap: 14px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat {
                min-height: 120px;
                padding: 12px;
                border-radius: 22px;
            }

            .stat .value {
                font-size: 18px;
            }

            .card {
                border-radius: 22px;
                padding: 14px;
            }
        }
    </style>

    <script>
        const INVOICES_KEY = 'storeInvoices';
        const PAYMENTS_KEY = 'storeDebtPayments';
        const PRODUCTS_KEY = 'storeProducts';
        const ADJUSTMENTS_KEY = 'storeStockAdjustments';
        const PURCHASES_KEY = 'storePurchases';
        const CASH_OPENING_KEY = 'storeCashOpening';
        const CASH_MANUAL_KEY = 'storeCashManual';

        function safeParse(text) {
            try {
                const value = JSON.parse(text || '[]');
                return Array.isArray(value) ? value : [];
            } catch {
                return [];
            }
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function money(n) {
            return Number(n || 0).toLocaleString('en-US') + ' د.ع';
        }

        function num(n) {
            return Number(n || 0).toLocaleString('en-US');
        }

        function todayLocal() {
            const d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().slice(0, 10);
        }

        function invoiceTotal(inv) {
            if (Array.isArray(inv.items)) {
                const subtotal = inv.items.reduce((s, it) => s + Number(it.total || 0), 0);
                return Math.max(0, subtotal - Number(inv.discount || 0));
            }
            return Number(inv.amount || 0);
        }

        function purchaseTotal(p) {
            const subtotal = (p.items || []).reduce((s, it) => s + Number(it.total || 0), 0);
            return Math.max(0, subtotal - Number(p.discount || 0));
        }

        const DAY_MS = 86400000;
        const LEVEL_ORDER = { danger: 0, warn: 1, info: 2 };

        function daysBetween(from, to) {
            const a = Date.parse(from + 'T00:00:00');
            const b = Date.parse(to + 'T00:00:00');
            return Number.isFinite(a) && Number.isFinite(b) ? Math.round((b - a) / DAY_MS) : 0;
        }

        function addDays(date, n) {
            const d = new Date(date + 'T00:00:00');
            d.setDate(d.getDate() + n);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // المدفوع لمورد فعلًا (مع الدفعات الجزئية) — نفس حساب صفحة المشتريات
        function purchasePaid(p) {
            if (p.payment !== 'دين') return purchaseTotal(p);
            if (Array.isArray(p.payments)) return p.payments.reduce((s, x) => s + Number(x.amount || 0), 0);
            return p.settled ? purchaseTotal(p) : 0;
        }

        // أسماء أول العناصر: «أ، ب، ج و٤ غيرها»
        function topNames(names, max = 3) {
            const list = names.filter(Boolean);
            const shown = list.slice(0, max).join('، ');
            return list.length > max ? `${shown} و${num(list.length - max)} غيرها` : shown;
        }

        function inventoryLink(list, title) {
            const ids = list.map(r => r.p.id).filter(Boolean);
            return ids.length && ids.length <= 300
                ? `inventory.html?ids=${encodeURIComponent(ids.join(','))}&title=${encodeURIComponent(title)}`
                : 'inventory.html';
        }

        function buildAlerts({ rows, stockRows, products, purchases, rate, cashBalance, today }) {
            const alerts = [];
            const add = (level, count, title, detail, href) => alerts.push({ level, count, title, detail, href });

            // مبيعات آخر 30 يومًا لكل منتج: لترتيب الأهم ولتوقع النفاد
            const since = addDays(today, -29);
            const recent = rows.map(r => r.inv).filter(inv => (inv.date || '') >= since && (inv.date || '') <= today);
            const live = stockRows.filter(r => !r.p.archived);
            live.forEach(r => { r.sold30 = StoreProducts.soldQty(r.p, recent); });
            const bySales = (a, b) => b.sold30 - a.sold30 || a.qty - b.qty;

            // 1) نفد من المخزن (منتج له سعر بيع؛ الأكثر مبيعًا أولًا)
            const out = live.filter(r => r.qty <= 0 && Number(r.p.price || 0) > 0).sort(bySales);
            if (out.length) {
                const selling = out.filter(r => r.sold30 > 0).length;
                add(selling ? 'danger' : 'warn', out.length, 'نفد من المخزن',
                    topNames(out.map(r => r.p.name)) + (selling ? ` — ${num(selling)} منها يُباع باستمرار` : ''),
                    inventoryLink(out, 'نفد من المخزن'));
            }

            // 2) قارب على النفاد: وصل الحد الأدنى الذي حدده صاحب المتجر (منتج بلا حد أدنى لا يُنبَّه عنه هنا)
            const low = live.filter(r => r.qty > 0 && Number(r.p.minQty || 0) > 0 && r.qty <= Number(r.p.minQty)).sort(bySales);
            if (low.length) {
                add('warn', low.length, 'قارب على النفاد',
                    topNames(low.map(r => `${r.p.name} (${num(r.qty)})`)),
                    inventoryLink(low, 'قارب على النفاد'));
            }

            // 3) سينفد قريبًا حسب سرعة البيع (≤ 7 أيام) وإن لم يصل الحد الأدنى
            const soon = live
                .filter(r => r.qty > Math.max(0, Number(r.p.minQty || 0)) && r.sold30 >= 3)
                .map(r => ({ ...r, days: Math.floor(r.qty / (r.sold30 / 30)) }))
                .filter(r => r.days <= 7)
                .sort((a, b) => a.days - b.days);
            if (soon.length) {
                add('warn', soon.length, 'سينفد قريبًا حسب سرعة البيع',
                    topNames(soon.map(r => `${r.p.name} (≈ ${num(Math.max(1, r.days))} ${r.days <= 1 ? 'يوم' : 'أيام'})`)),
                    inventoryLink(soon, 'سينفد قريبًا'));
            }

            // 4) أسعار تحتاج مراجعة: سعر البيع أقل من التكلفة، أو منتج في المخزن بلا سعر بيع
            const below = [];
            const noPrice = [];
            live.forEach(r => {
                const price = StoreProducts.priceIQD(r.p, rate);
                const cost = StoreProducts.costIQD(r.p, rate);
                if (Number(r.p.price || 0) <= 0) {
                    if (r.qty > 0) noPrice.push(r);
                } else if (price !== null && cost > 0 && price < cost) {
                    below.push(r);
                }
            });
            if (below.length || noPrice.length) {
                const parts = [];
                if (below.length) parts.push(`${num(below.length)} بسعر أقل من التكلفة: ${topNames(below.map(r => r.p.name), 2)}`);
                if (noPrice.length) parts.push(`${num(noPrice.length)} بلا سعر بيع`);
                add(below.length ? 'danger' : 'warn', below.length + noPrice.length, 'أسعار تحتاج مراجعة',
                    parts.join(' — '), inventoryLink([...below, ...noPrice], 'أسعار تحتاج مراجعة'));
            }

            // 5) سعر الدولار: منتجات بالدولار بلا سعر صرف، أو سعر قديم
            const usdCount = live.filter(r => r.p.currency === 'USD').length;
            if (usdCount) {
                if (!rate) {
                    add('danger', usdCount, 'لا يوجد سعر صرف للدولار', 'منتجات الدولار لا تظهر بسعر في الكاشير حتى تسجل سعر الصرف', 'exchange-rate.html');
                } else if (rate.source !== 'fixed') {
                    const day = rate.date || String(rate.at || '').slice(0, 10);
                    const age = day ? daysBetween(day, today) : 0;
                    if (age > 2) {
                        add('warn', usdCount, 'سعر الدولار قديم', `آخر تحديث قبل ${num(age)} يوم (${num(rate.rate)} دينار) — ${num(usdCount)} منتج بالدولار`, 'exchange-rate.html');
                    }
                }
            }

            // 6) أقساط متأخرة
            const late = StoreCredit.overdueInstallments();
            if (late.length) {
                const amount = late.reduce((s, x) => s + x.overdueAmount, 0);
                add('danger', late.length, `أقساط متأخرة — ${money(amount)}`,
                    topNames([...new Set(late.map(x => (x.inv.customer || x.plan.customer || '').trim()))]),
                    'customers.html?filter=late');
            }

            // 6ب) أقساط تستحق اليوم أو غدًا: تنبيه قبل موعد التسديد بيوم، ويفتح تذكيرات الواتساب الجاهزة
            const upcoming = StoreCredit.upcomingInstallments(1);
            [[0, 'أقساط تستحق اليوم'], [1, 'أقساط تستحق غدًا']].forEach(([inDays, title]) => {
                const list = upcoming.filter(x => x.inDays === inDays);
                if (!list.length) return;
                const amount = list.reduce((s, x) => s + x.left, 0);
                add('warn', list.length, `${title} — ${money(amount)}`,
                    topNames(list.map(x => `${x.customer || 'بدون اسم'} (${money(x.left)})`)),
                    'debts.html#reminders');
            });

            // 6ج) تذكيرات واتساب لم تُرسل بعد
            if (window.StoreReminders) {
                const pending = StoreReminders.queue().filter(x => !x.sent);
                if (pending.length) {
                    add('info', pending.length, 'تذكيرات أقساط جاهزة للإرسال بالواتساب',
                        topNames(pending.map(x => `${x.customer || 'بدون اسم'} (${StoreReminders.whenText(x.inDays)})`)),
                        'debts.html#reminders');
                }
            }

            // 7) ديون زبائن مضى عليها أكثر من 30 يومًا (غير المقسطة؛ المقسطة لها تنبيهات الأقساط)
            const planned = new Set(safeParse(localStorage.getItem('storeInstallments')).map(p => p.invoiceNumber));
            const old = rows
                .filter(r => r.inv.payment === 'دين' && r.remaining > 0 && !planned.has(r.inv.number)
                    && r.inv.date && daysBetween(r.inv.date, today) > 30)
                .sort((a, b) => b.remaining - a.remaining);
            if (old.length) {
                const total = old.reduce((s, r) => s + r.remaining, 0);
                const perCustomer = new Map();
                old.forEach(r => {
                    const name = (r.inv.customer || '').trim() || 'بدون اسم';
                    perCustomer.set(name, (perCustomer.get(name) || 0) + r.remaining);
                });
                const [topName, topAmount] = [...perCustomer.entries()].sort((a, b) => b[1] - a[1])[0];
                add('warn', old.length, `ديون أقدم من 30 يومًا — ${money(total)}`,
                    `${num(perCustomer.size)} زبون، أكبرها: ${topName} (${money(topAmount)})`,
                    'customers.html?filter=debt');
            }

            // 8) فواتير الموردين: المتبقي الفعلي بعد الدفعات الجزئية
            const unpaid = purchases
                .filter(p => p.payment === 'دين')
                .map(p => ({ p, left: Math.max(0, purchaseTotal(p) - purchasePaid(p)) }))
                .filter(x => x.left > 0);
            if (unpaid.length) {
                const total = unpaid.reduce((s, x) => s + x.left, 0);
                const suppliers = [...new Set(unpaid.map(x => (x.p.supplier || '').trim()))];
                add('warn', unpaid.length, `مستحق للموردين — ${money(total)}`,
                    topNames(suppliers), 'purchases.html?filter=unpaid');
            }

            // 9) الصندوق بالسالب: مصروف أكثر من الموجود، غالبًا عملية لم تُسجل
            if (cashBalance < 0) {
                add('danger', 1, `رصيد الصندوق بالسالب — ${money(cashBalance)}`, 'راجع حركات الصندوق: قد يكون هناك قبض لم يُسجل', 'cashbox.html');
            }

            return alerts.sort((a, b) => LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]);
        }

        function computeData() {
            const invoices = safeParse(localStorage.getItem(INVOICES_KEY));
            const payments = safeParse(localStorage.getItem(PAYMENTS_KEY));
            const products = safeParse(localStorage.getItem(PRODUCTS_KEY));
            const adjustments = safeParse(localStorage.getItem(ADJUSTMENTS_KEY));
            const purchases = safeParse(localStorage.getItem(PURCHASES_KEY));
            const manual = safeParse(localStorage.getItem(CASH_MANUAL_KEY));
            const opening = Number(localStorage.getItem(CASH_OPENING_KEY) || 0);
            const today = todayLocal();
            const rate = StoreProducts.usdRate();

            const paidFor = number => payments
                .filter(p => p.invoiceNumber === number)
                .reduce((s, p) => s + Number(p.amount || 0), 0);

            const rows = invoices.map((inv, index) => {
                const amount = invoiceTotal(inv);
                const paid = paidFor(inv.number);
                return { inv, index, amount, paid, remaining: Math.max(0, amount - paid) };
            });

            // المبيعات اليومية
            const todaySales = rows.filter(r => r.inv.date === today);
            const todayTotal = todaySales.reduce((s, r) => s + r.amount, 0);

            // رصيد الصندوق
            let cashIn = opening;
            let cashOut = 0;
            rows.forEach(r => {
                if (r.inv.payment === 'نقدي' || r.inv.payment === 'بطاقة') cashIn += r.amount;
            });
            payments.forEach(p => { cashIn += Number(p.amount || 0); });
            // المدفوع فعلًا للموردين، مع الدفعات الجزئية (نفس حساب صفحة الصندوق)
            purchases.forEach(p => { cashOut += purchasePaid(p); });
            manual.forEach(m => {
                if (m.kind === 'in') cashIn += Number(m.amount || 0);
                else cashOut += Number(m.amount || 0);
            });
            const cashBalance = cashIn - cashOut;

            // ديون الزبائن
            const openDebts = rows.filter(r => r.inv.payment === 'دين' && r.remaining > 0);
            const debtTotal = openDebts.reduce((s, r) => s + r.remaining, 0);
            const debtCustomers = new Set(openDebts.map(r => (r.inv.customer || '').trim())).size;

            // المخزون بسعر التكلفة
            const stockRows = products.map(p => {
                const adjusted = adjustments
                    .filter(a => a.productId === p.id)
                    .reduce((s, a) => s + Number(a.change || 0), 0);
                const sold = StoreProducts.soldQty(p, rows.map(r => r.inv));
                const qty = Number(p.openingQty || 0) + adjusted - sold;
                return { p, qty, value: Math.max(0, qty) * StoreProducts.costIQD(p, rate) };
            });
            const stockValue = stockRows.reduce((s, r) => s + r.value, 0);
            const productCount = products.length;

            // الربح التقديري
            let cogs = 0;
            rows.forEach(r => {
                if (!Array.isArray(r.inv.items)) return;
                r.inv.items.forEach(it => {
                    cogs += StoreProducts.itemCost(it, products, rate);
                });
            });
            const rawSales = rows.reduce((s, r) => s + r.amount, 0);
            const profit = rawSales - cogs;

            // آخر المبيعات
            const latest = [...rows]
                .sort((a, b) => (b.inv.date || '').localeCompare(a.inv.date || '') || b.index - a.index)
                .slice(0, 6);

            // ===== التنبيهات: الأهم أولًا، وكل تنبيه يفتح الصفحة على العناصر المقصودة نفسها =====
            const alerts = buildAlerts({ rows, stockRows, products, purchases, rate, cashBalance, today });

            return {
                stats: [
                    { title: 'صافي الربح التقديري', value: money(profit), note: 'كل المبيعات منذ البداية: الإيراد − تكلفة المباع', hero: true },
                    { title: 'مبيعات اليوم', value: money(todayTotal), note: `${num(todaySales.length)} فاتورة` },
                    { title: 'رصيد الصندوق', value: money(cashBalance), note: 'النقد الحالي' },
                    { title: 'المخزون (بالتكلفة)', value: money(stockValue), note: `${num(productCount)} منتج` },
                    { title: 'ديون الزبائن', value: money(debtTotal), note: `${num(debtCustomers)} زبون` }
                ],
                latest,
                alerts
            };
        }

        function render() {
            const data = computeData();

            const info = window.getStoreInfo ? window.getStoreInfo() : { name: 'اسم المتجر' };
            document.getElementById('storeBrand').innerHTML = `مرحبا بك<span>“${esc(info.name)}”</span>`;

            document.getElementById('stats').innerHTML = data.stats.map(item => `
                <article class="stat ${item.hero ? 'hero' : ''}">
                    <div>
                        <div class="label">${esc(item.title)}</div>
                        <div class="value">${item.value}</div>
                    </div>
                    <div class="note">${esc(item.note)}</div>
                </article>`).join('');

            document.getElementById('salesRows').innerHTML = data.latest.length
                ? data.latest.map(r => `
                    <tr>
                        <td>#${esc(r.inv.number)}</td>
                        <td>${esc(r.inv.customer)}</td>
                        <td>${money(r.amount)}</td>
                        <td><span class="pay ${r.inv.payment === 'دين' ? 'debt' : ''}">${esc(r.inv.payment)}</span></td>
                    </tr>`).join('')
                : `<tr><td class="empty" colspan="4">لا توجد مبيعات بعد</td></tr>`;

            document.getElementById('alerts').innerHTML = data.alerts.length
                ? data.alerts.map(item => `
                    <a class="alert lv-${item.level}" href="${esc(item.href)}">
                        <span class="count">${num(item.count)}</span>
                        <span class="txt"><b>${esc(item.title)}</b>${item.detail ? `<small>${esc(item.detail)}</small>` : ''}</span>
                    </a>`).join('')
                : `<div class="alert ok">لا توجد تنبيهات حالياً</div>`;
        }

        // ===== ملخص اليوم للمالك =====
        const REPORT_PHONE_KEY = 'storeReportPhone';

        function dailySummary() {
            const invoices = safeParse(localStorage.getItem(INVOICES_KEY));
            const payments = safeParse(localStorage.getItem(PAYMENTS_KEY));
            const products = safeParse(localStorage.getItem(PRODUCTS_KEY));
            const adjustments = safeParse(localStorage.getItem(ADJUSTMENTS_KEY));
            const manual = safeParse(localStorage.getItem(CASH_MANUAL_KEY));
            const today = todayLocal();

            const todays = invoices.filter(inv => inv.date === today);
            const byPay = kind => todays.filter(inv => inv.payment === kind).reduce((s, inv) => s + invoiceTotal(inv), 0);
            // فاتورة دين سُددت بالكامل تتحول إلى نقدي؛ نحسبها دينًا في يومها
            const debtToday = todays.filter(inv => inv.payment === 'دين' || inv.debtSettled).reduce((s, inv) => s + invoiceTotal(inv), 0);
            const cashToday = todays.filter(inv => inv.payment === 'نقدي' && !inv.debtSettled).reduce((s, inv) => s + invoiceTotal(inv), 0);

            let cogs = 0;
            const rate = StoreProducts.usdRate();
            todays.forEach(inv => (inv.items || []).forEach(it => {
                cogs += StoreProducts.itemCost(it, products, rate);
            }));
            const salesTotal = todays.reduce((s, inv) => s + invoiceTotal(inv), 0);

            const lowStock = products.filter(p => {
                const adjusted = adjustments.filter(a => a.productId === p.id).reduce((s, a) => s + Number(a.change || 0), 0);
                const qty = Number(p.openingQty || 0) + adjusted - StoreProducts.soldQty(p, invoices);
                return qty <= Number(p.minQty || 0);
            }).map(p => p.name);

            const data = computeData();
            const statValue = title => (data.stats.find(x => x.title === title) || {}).value || '';
            const toNum = v => Number(String(v).replace(/[^\d.-]/g, '')) || 0;

            return {
                date: today,
                salesTotal,
                invoiceCount: todays.length,
                cash: cashToday,
                card: byPay('بطاقة'),
                debt: debtToday,
                collected: payments.filter(p => p.date === today).reduce((s, p) => s + Number(p.amount || 0), 0),
                profit: salesTotal - cogs,
                expenses: manual.filter(m => m.kind !== 'in' && m.date === today).reduce((s, m) => s + Number(m.amount || 0), 0),
                cashBalance: toNum(statValue('رصيد الصندوق')),
                debtTotal: toNum(statValue('ديون الزبائن')),
                lowStock
            };
        }

        const dailyBtn = document.getElementById('dailyWa');
        dailyBtn.innerHTML = StoreWA.ICON + '<span>ملخص اليوم</span>';
        dailyBtn.addEventListener('click', async () => {
            const phone = await StoreWA.compose({
                title: 'ملخص اليوم',
                intro: 'يُرسل لرقم المالك، ويُحفظ الرقم للمرة القادمة.',
                phone: localStorage.getItem(REPORT_PHONE_KEY) || '',
                text: StoreWA.dailyText(dailySummary())
            });
            if (phone && phone !== localStorage.getItem(REPORT_PHONE_KEY)) localStorage.setItem(REPORT_PHONE_KEY, phone);
        });

        // ===== خطوات البدء: تظهر للمدير حتى يكمل الأساسيات أو يخفيها =====
        const SETUP_HIDDEN_KEY = 'appSetupHidden';
        function drawSetup() {
            const box = document.getElementById('setup');
            const me = window.StoreAuth && StoreAuth.currentUser ? StoreAuth.currentUser() : null;
            if (!me || me.role !== 'admin' || localStorage.getItem('appDemo') === '1' || localStorage.getItem(SETUP_HIDDEN_KEY) === '1') { box.hidden = true; return; }
            const info = window.getStoreInfo ? window.getStoreInfo() : {};
            const has = k => safeParse(localStorage.getItem(k)).length > 0;
            const steps = [
                { done: !!info.phone, text: 'أكمل بيانات المتجر (الهاتف والعنوان)', href: 'settings.html#store' },
                { done: has(PRODUCTS_KEY), text: 'أضف منتجاتك للمخزن', href: 'inventory.html' },
                { done: has(INVOICES_KEY), text: 'سجّل أول بيعة من الكاشير', href: 'cashier.html' }
            ];
            const left = steps.filter(x => !x.done).length;
            box.hidden = left === 0;
            if (!left) return;
            document.getElementById('setupNote').textContent = left === 1 ? 'بقيت خطوة واحدة' : `بقيت ${left} خطوات من ${steps.length}`;
            document.getElementById('setupSteps').innerHTML = steps.map(x => `
                <a class="setup-step ${x.done ? 'done' : ''}" href="${x.href}">
                    <span class="tick" aria-hidden="true"></span>
                    <span>${esc(x.text)}</span>
                </a>`).join('');
        }
        document.getElementById('setupHide').addEventListener('click', () => {
            localStorage.setItem(SETUP_HIDDEN_KEY, '1');
            document.getElementById('setup').hidden = true;
        });
        if (window.StoreAuth) StoreAuth.ready.then(drawSetup);

        window.addEventListener('storage', () => { render(); drawOrders(); drawDevices(); });
        document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); drawOrders(); drawDevices(); } });

        try {
            render();
        } catch (err) {
            console.error('فشل تحميل الصفحة الرئيسية:', err);
        }

        // طلبات المتجر الإلكتروني الجديدة (من الخادم، لا تؤخر ظهور الصفحة)
        let ordersCount = 0;

        async function showNewOrders() {
            if (!window.StoreShop) return;
            ordersCount = await StoreShop.newOrdersCount();
            drawOrders();
        }

        function drawOrders() {
            const n = ordersCount;
            document.querySelectorAll('.alert.orders').forEach(el => el.remove());
            if (!n) return;
            const list = document.getElementById('alerts');
            list.querySelector('.alert.ok')?.remove();
            const a = document.createElement('a');
            a.className = 'alert orders lv-info';
            a.href = 'orders.html';
            a.innerHTML = `<span class="count">${num(n)}</span><span class="txt"><b>طلبات جديدة من المتجر الإلكتروني</b><small>بانتظار القبول</small></span>`;
            list.prepend(a);
        }
        if (window.StoreAuth) StoreAuth.ready.then(showNewOrders);

        // ===== أجهزة جديدة دخلت للمتجر خلال يومين (للمدير) =====
        let newDevices = [];
        async function showNewDevices() {
            const me = StoreAuth.currentUser();
            if (!me || me.role !== 'admin' || navigator.onLine === false) return;
            try {
                const client = await StoreAuth.getClient();
                const since = new Date(Date.now() - 2 * DAY_MS).toISOString();
                const { data, error } = await client.from('store_devices')
                    .select('device_id, display_name, username, label, platform, browser')
                    .eq('store_id', me.store_id)
                    .eq('revoked', false)
                    .gte('first_seen', since);
                if (error) return;
                const mine = StoreAuth.deviceId();
                newDevices = (data || []).filter(d => d.device_id !== mine);
                drawDevices();
            } catch (e) { }
        }

        function drawDevices() {
            document.querySelectorAll('.alert.devices').forEach(el => el.remove());
            if (!newDevices.length) return;
            const list = document.getElementById('alerts');
            list.querySelector('.alert.ok')?.remove();
            const a = document.createElement('a');
            a.className = 'alert devices lv-info';
            a.href = 'users.html#devices';
            const who = topNames(newDevices.map(d => `${d.display_name || d.username} (${d.label || [d.platform, d.browser].filter(Boolean).join(' – ')})`), 2);
            a.innerHTML = `<span class="count">${num(newDevices.length)}</span><span class="txt"><b>أجهزة جديدة دخلت للمتجر</b><small>${esc(who)}</small></span>`;
            list.appendChild(a);
        }
        if (window.StoreAuth) StoreAuth.ready.then(showNewDevices);
        setInterval(() => { if (!document.hidden) showNewOrders(); }, 60000);
    </script>
</body>
